# Bajiman monorepo supervisor config (Express server + Vite client).
# Copy over /etc/supervisor/conf.d/supervisord.conf after a pod restart:
#   sudo cp /app/scripts/supervisord.conf /etc/supervisor/conf.d/supervisord.conf
#   sudo supervisorctl reread && sudo supervisorctl update

[program:backend]
command=node index.js
directory=/app/bajiman-main/server
autostart=true
autorestart=true
environment=PORT="8001",APP_URL="https://6c847b38-af7d-4785-bd9e-f7fc703fa7f0.preview.emergentagent.com",INTEGRATION_PROXY_URL="https://integrations.emergentagent.com"
stderr_logfile=/var/log/supervisor/backend.err.log
stdout_logfile=/var/log/supervisor/backend.out.log
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

[program:frontend]
command=yarn dev --port 3000 --host 0.0.0.0
environment=HOST="0.0.0.0",PORT="3000",EMERGENT_OVERLAY_RRWEB="buffer",DISABLE_EMERGENT_OVERLAY="false",EMERGENT_OVERLAY_FAB="off",
directory=/app/bajiman-main/client
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/frontend.err.log
stdout_logfile=/var/log/supervisor/frontend.out.log
stopsignal=TERM
stopwaitsecs=50
stopasgroup=true
killasgroup=true

[program:mongodb]
command=/usr/bin/mongod --bind_ip_all
autostart=true
autorestart=true
stderr_logfile=/var/log/mongodb.err.log
stdout_logfile=/var/log/mongodb.out.log
